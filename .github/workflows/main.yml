
name: Build STRYDE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'STRYDE-Android-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract STRYDE project
        run: |
          unzip -q STRYDE-Android-Project.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build STRYDE APK
        working-directory: source/STRYDE-Android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload STRYDE APK
        uses: actions/upload-artifact@v4
        with:
          name: STRYDE-APK
          path: source/STRYDE-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
